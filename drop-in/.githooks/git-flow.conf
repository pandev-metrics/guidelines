# Правила git flow — единственное место, где их настраивают.
# Хуки из .githooks читают этот файл. Значения — расширенные регулярные выражения (grep -E).
# После правки повторите те же значения в server pre-receive, в rulesets GitHub
# и в регулярках атрибуции PanDev (см. README, раздел «Совместимость с PanDev»).

# Ключ задачи. По умолчанию — ключи Jira, YouTrack, Yandex Tracker, Linear, Task Flow, Bitrix24:
# PROJ-123, QA2-15, MY_APP-7, а также импортированные в Task Flow PROJ-12_jira, PROJ-12_jira_2.
KEY_RE='[A-Z][A-Z0-9_]*-[0-9]+(_[a-z]+(_[0-9]+)?)?'
# Azure Boards (ветка feature/4521):
# KEY_RE='[0-9]+'
# ClickUp без Custom Task IDs (ветка feature/CU-869dmarzn или feature/869dmarzn):
# KEY_RE='(CU-)?[0-9a-z]{6,12}'

# Префиксы рабочих веток.
BRANCH_TYPES='feature|bugfix|hotfix'

# Типы в сообщении коммита: «тип/КЛЮЧ - Описание».
COMMIT_TYPES='feature|bugfix|hotfix|fix|refactor|docs|test|chore|ci|style|release'

# 0 — только «тип/КЛЮЧ» (правило команды, не требование PanDev).
# 1 — разрешить хвост в нижнем регистре: feature/PROJ-123-login.
#     Хвост в нижнем регистре не может содержать второй ключ, поэтому ветка не станет неоднозначной.
ALLOW_BRANCH_SUFFIX=0

# Общие ветки и ветки окружений: имя без ключа, коммиты проверяются, совпадение ключа — нет.
ENV_BRANCH_RE='^(main|master|dev|develop|test|qa|uat|stage|staging|preprod|demo|prod|production|live|stable|release/.+)$'

# Ветки ботов: имя и коммиты не проверяются.
SKIP_BRANCH_RE='^(dependabot|renovate)/'

# Служебные сообщения: формат, ключ и почта не проверяются.
SKIP_SUBJECT_RE='^(Merge |Revert |Bump |chore\(deps(-dev)?\): |Update dependency )'

# Почта автора коммита. Пусто — не проверяется. Пример: '@company\.com$'
ALLOWED_EMAIL_RE=''
